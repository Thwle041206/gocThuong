name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Pull requests get a temporary preview link; pushes to main go live.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GOCTHUONG }}
          projectId: gocthuong
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
